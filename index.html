<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="input-area">
      <input type="text" id="name" placeholder="銘柄名">
      <input type="number" id="shares" placeholder="株数">
      <input type="number" id="buyPrice" placeholder="取得単価">
      <input type="number" id="currentPrice" placeholder="現在株価">
      <input type="text" id="accountType" placeholder="口座区分">
      <input type="text" id="buyDate" class="buy-date-input" placeholder="買付日">
      <input type="text" id="tag" placeholder="タグ">
      <textarea id="memo" placeholder="メモ"></textarea>
      <textarea id="sellRule" placeholder="売却ルール"></textarea>
      <textarea id="diary" placeholder="投資記録"></textarea>

      <button id="addBtn">追加</button>
      <button id="sortBuyDateBtn" class="action-btn">買付日順</button>
      <button id="sortCodeBtn" class="action-btn">コード順</button>
      <button id="sortProfitRateBtn" class="action-btn">損益率悪い順</button>
      <input type="file" id="importFile" accept=".csv" multiple>
      <button id="exportBtn" class="action-btn">CSV出力</button>
      <button id="clearAllBtn" class="action-btn danger-btn">全削除</button>
    </div>

    <div id="totalProfit" class="total-profit"></div>

    <div class="list-area">

    <table>
      <thead>
        <tr>
          <th>コード</th>
          <th>銘柄</th>
          <th>口座</th>
          <th>買付日</th>
          <th>株数</th>
          <th>取得</th>
          <th>現在</th>
          <th>損益</th>
          <th>率</th>
          <th>タグ</th>
          <th>メモ</th>
          <th>売却ルール</th>
          <th>投資記録</th>
          <th>編集</th>
          <th>削除</th>
        </tr>
      </thead>
      <tbody id="stockTable"></tbody>
    </table>

    <div id="mobileCards"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
