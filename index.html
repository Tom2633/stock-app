<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="input-area">
      <input type="text" id="name" placeholder="銘柄名">
      <input type="number" id="shares" placeholder="株数">
      <input type="number" id="buyPrice" placeholder="取得単価">
      <input type="number" id="currentPrice" placeholder="現在株価">
      <input type="text" id="accountType" placeholder="口座区分（NISA・特定など）">
      <input type="text" id="tag" placeholder="タグ">
      <textarea id="memo" placeholder="メモ"></textarea>
      <textarea id="sellRule" placeholder="売却ルール"></textarea>
      <textarea id="diary" placeholder="投資日記"></textarea>

      <button id="addBtn">追加</button>
      <input type="file" id="importFile" accept=".csv" multiple>
      <button id="exportBtn">CSV出力</button>
      <button id="clearAllBtn">全データ削除</button>
    </div>

    <div id="totalProfit" class="total-profit"></div>

    <table>
      <thead>
        <tr>
          <th>コード</th>
          <th>銘柄</th>
          <th>口座</th>
          <th>株数</th>
          <th>取得</th>
          <th>現在</th>
          <th>損益</th>
          <th>率</th>
          <th>タグ</th>
          <th>編集</th>
          <th>削除</th>
        </tr>
      </thead>
      <tbody id="stockTable"></tbody>
    </table>

    <div id="mobileCards"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
