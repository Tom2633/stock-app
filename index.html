<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>株管理アプリ</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="form-area">

      <input type="text" id="name" placeholder="銘柄名">

      <input type="number" id="shares" placeholder="株数">

      <input type="number" id="buyPrice" placeholder="取得単価">

      <input type="number" id="currentPrice" placeholder="現在株価">

      <input type="text" id="tag" placeholder="タグ（高配当・優待など）">

      <textarea id="memo" placeholder="メモ"></textarea>

      <textarea id="sellRule" placeholder="売却ルール"></textarea>

      <textarea id="diary" placeholder="投資日記"></textarea>

      <button id="addBtn">追加</button>

      <button id="exportBtn">CSV出力</button>

      <input type="file" id="importFile" accept=".csv">

    </div>

    <div class="table-area">

      <table>

        <thead>
          <tr>
            <th>日付</th>
            <th>銘柄</th>
            <th>株数</th>
            <th>取得単価</th>
            <th>現在株価</th>
            <th>損益</th>
            <th>損益率</th>
            <th>タグ</th>
            <th>メモ</th>
            <th>売却ルール</th>
            <th>投資日記</th>
            <th>編集</th>
            <th>削除</th>
          </tr>
        </thead>

        <tbody id="stockTable">
        </tbody>

      </table>

    </div>

    <div id="totalProfit" class="total-profit">
      合計損益：0 円
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
